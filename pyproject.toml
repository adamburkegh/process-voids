[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "process-voids"
version = "0.4.3"
description = "Characterising unobserved activities in process event data."
requires-python = ">=3.10"
dependencies = [
    "pm4py>=2.7,<=2.8",
    "rustxes>=0.2.10",
    # Pinned to specific skip-alignments release due to strong dependency
    "skipalignments @ git+https://github.com/adamburkegh/skip-alignments@v0.2.3+p3",
    "pm4py_config>=0.1.0,<=0.9",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["process_voids*", "lab*"]
