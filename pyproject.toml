[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "process-voids"
version = "0.4.0"
description = "Characterising unobserved activities in process event data."
requires-python = ">=3.10"
dependencies = [
    "pm4py>=2.7,<=2.8",
    "rustxes>=0.2.10",
    # main tracks skip-alignments' own dev HEAD (editable, local path) rather
    # than a PyPI release - process-voids' main is itself a dev branch, and
    # currently depends on unreleased skip-alignments API (tau_ids,
    # id_loop_list). A tagged process-voids release should pin this to
    # whatever skipalignments release exists on PyPI at that point instead.
    "skipalignments @ file:../skip-alignments",
    "pm4py_config>=0.1.0,<=0.9",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["process_voids*", "lab*"]
